name: Tier A

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  plugin-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: harveybc/doin-core
          ref: e05a3325625a9ad497b56866485c7606024e3681
          path: .ci/doin-core
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: harveybc/doin-node
          ref: a9a0baa55f091e4e1f3a7407fdd867609ea44635
          path: .ci/doin-node
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: harveybc/agent-multi
          ref: 8e63b7dce25357c02e6690cc405f0703e362ad3d
          path: .ci/agent-multi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Record dependency and component identity
        run: |
          sha256sum pyproject.toml requirements-ci.txt
          git -C .ci/doin-core rev-parse HEAD
          git -C .ci/doin-node rev-parse HEAD
          git -C .ci/agent-multi rev-parse HEAD
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps -e .ci/doin-core
          python -m pip install --no-deps -e .ci/doin-node
          python -m pip install --no-deps -e .ci/agent-multi
          python -m pip install --no-deps -e .
      - name: Compile package
        run: python -m compileall -q src
      - name: Run plugin contracts
        run: python -m pytest -q
